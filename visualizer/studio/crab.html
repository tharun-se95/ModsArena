<!doctype html>
<meta charset="utf-8">
<title>Crab critter</title>
<style>
  body { margin: 0; padding: 32px 40px; background: #f8efe4; color: #1d1b19; font: 15px/1.4 system-ui, sans-serif; width: 1280px; box-sizing: border-box; }
  h1 { font: 700 44px/1 Georgia, serif; margin: 0 0 6px; }
  h2 { font-size: 15px; margin: 28px 0 8px; }
  p { margin: 0; color: #6d6359; }
  .top { display: flex; gap: 32px; align-items: center; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  figure { margin: 0; text-align: center; }
  figure img { display: block; width: 100%; }
  #hero img { width: 720px; }
  #turn figure img { width: 290px; }
  #faces figure img { width: 112px; }
  #colours figure img { width: 232px; }
  #team figure img, #team-back figure img { width: 390px; }
  figcaption { font-size: 13px; color: #6d6359; }
</style>
<div class="top">
  <div><h1>Crab critter</h1><p>The default build, after the Claude Bot mascot sheets.</p></div>
  <div id="hero"></div>
</div>
<h2>The team</h2><div class="row" id="team"></div><div class="row" id="team-back"></div>
<h2>Turnaround</h2><div class="row" id="turn"></div>
<h2>Faces</h2><div class="row" id="faces"></div>
<h2>Colours</h2><div class="row" id="colours"></div>
<script src="dist/crab-studio.js"></script>

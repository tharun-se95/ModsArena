<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Cluster 3D</title>
  <style>
    /* Layout: the 3D field fills the left; HUD panels float over its corners,
       the activity column docks right. One dark look, set on purpose. */
    :root {
      color-scheme: dark;
      --bg: #05060d;
      --panel: rgba(12, 16, 30, 0.82);
      --line: rgba(127, 231, 255, 0.18);
      --text: #d7e3f4;
      --dim: #7d8aa3;
      --accent: #7fe7ff;
      --ok: #4ef08a;
      --warn: #ffd166;
      --err: #ff4d6d;
      --spawn: #b48cff;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --side: min(400px, 34vw);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.45 var(--mono); }
    [hidden] { display: none !important; }
    #graph { position: fixed; inset: 0; }
    @media (min-width: 761px) { #graph { right: calc(var(--side) + 32px); } }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); }
    button { font: inherit; color: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    header { top: 16px; left: 16px; padding: 12px 16px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
    header h1 { margin: 0; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    #conn { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; color: var(--dim); letter-spacing: 0; text-transform: none; }
    #conn.live { color: var(--ok); }
    #conn.down { color: var(--err); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 16px; }
    .stats div { display: flex; flex-direction: column; min-width: 0; }
    .stats b { font-size: 19px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
    .stats span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
    select { flex: 1; min-width: 0; background: #0b1020; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
    label.check { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12px; cursor: pointer; }

    #side { top: 16px; right: 16px; bottom: 16px; width: var(--side); padding: 12px 0 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    #side h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); display: flex; gap: 8px; }
    #alerts { padding-right: 12px; }
    #alerts h2 { color: var(--warn); }
    #alert-count { color: var(--bg); background: var(--warn); border-radius: 999px; padding: 0 6px; }
    #alert-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 22vh; overflow-y: auto; }
    #alert-list li { display: flex; justify-content: space-between; gap: 8px; }
    #alert-list time { color: var(--dim); white-space: nowrap; }
    .feed-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #feed { list-style: none; margin: 0; padding: 0 12px 0 0; overflow-y: auto; flex: 1; }
    #feed li { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: in 0.35s ease-out; }
    #feed time { color: var(--dim); margin-right: 8px; }
    #feed b { color: var(--accent); font-weight: 500; margin-right: 6px; }
    .err { color: var(--err); } .spawn { color: var(--spawn); } .turn { color: var(--accent); } .dim { color: var(--dim); } .warn { color: var(--warn); }
    @keyframes in { from { opacity: 0; transform: translateX(8px); } }
    @media (prefers-reduced-motion: reduce) { #feed li { animation: none; } }

    .link { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--accent); text-decoration: underline; text-decoration-color: rgba(127,231,255,0.3); text-underline-offset: 3px; }
    .link.warn { color: var(--warn); } .link.compact { color: var(--text); }

    #detail { left: 16px; bottom: 16px; width: 380px; max-height: calc(100% - 300px); display: flex; flex-direction: column; }
    #detail-close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 16px; }
    #detail .body { padding: 12px 16px; overflow-y: auto; }
    #detail h3 { margin: 0 24px 2px 0; color: #fff; font-size: 14px; display: flex; gap: 8px; align-items: center; word-break: break-word; }
    #detail h4 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
    #detail h4 small { color: var(--text); }
    #detail .sub { margin: 0 0 10px; color: var(--dim); word-break: break-all; }
    #detail dl { display: grid; grid-template-columns: 100px 1fr; gap: 3px 10px; margin: 10px 0 0; }
    #detail dt { color: var(--dim); } #detail dd { margin: 0; word-break: break-all; font-variant-numeric: tabular-nums; }
    .meter { display: flex; align-items: baseline; gap: 10px; }
    .meter b { font-size: 26px; font-variant-numeric: tabular-nums; }
    .meter span { color: var(--dim); }
    .bar { position: relative; display: flex; height: 10px; margin-top: 6px; background: #121a2b; border-radius: 3px; overflow: hidden; }
    .bar.small { height: 6px; margin: 0; flex: 1; }
    .bar i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--err); }
    .cats, .plain, .sessions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .cats li { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; }
    .cats i { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.15); }
    .cats b { font-weight: 500; font-variant-numeric: tabular-nums; }
    .plain time, .prompts time, .sessions time { color: var(--dim); margin-right: 8px; }
    .sessions li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; }
    .sessions .link { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prompts { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .prompts li { border-left: 2px solid var(--line); padding-left: 8px; }
    .prompts time { display: block; }
    .limit { display: grid; grid-template-columns: 80px 1fr 40px; gap: 8px; align-items: center; margin-bottom: 4px; }
    .limit b { text-align: right; font-weight: 500; }
    .pill { font-size: 10px; font-weight: 500; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: 0.04em; }
    .pill.active { color: var(--ok); } .pill.idle { color: var(--warn); } .pill.done, .pill.past { color: var(--dim); } .pill.error { color: var(--err); } .pill.ok { color: var(--ok); }

    #legend { left: calc(50% - var(--side) / 2 - 16px); bottom: 16px; transform: translateX(-50%); padding: 8px 14px; display: flex; gap: 14px; font-size: 11px; color: var(--dim); }
    #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    #detail:not([hidden]) ~ #legend { display: none; }
    .tip { font: 12px/1.4 var(--mono); max-width: 360px; white-space: normal; }
    @media (max-width: 760px) {
      header { width: auto; right: 16px; }
      #side { top: auto; height: 32vh; left: 16px; right: 16px; width: auto; }
      #legend { display: none; }
      #detail { left: 16px; right: 16px; width: auto; bottom: calc(32vh + 24px); max-height: 40vh; }
    }
  </style>
</head>
<body>
  <div id="graph"></div>

  <header class="panel">
    <h1>Agent Cluster <span id="conn">connecting…</span></h1>
    <div class="stats">
      <div><b id="stat-projects">0</b><span>projects</span></div>
      <div><b id="stat-sessions">0</b><span>live sessions</span></div>
      <div><b id="stat-agents">0</b><span>agents live</span></div>
      <div><b id="stat-tools">0</b><span>tools live</span></div>
      <div><b id="stat-calls">0</b><span>tool calls</span></div>
      <div><b id="stat-cost">$0.00</b><span>live cost</span></div>
    </div>
    <div class="controls">
      <select id="project-filter" aria-label="Project"><option value="">All projects</option></select>
      <label class="check"><input type="checkbox" id="show-past" checked> Past sessions</label>
    </div>
  </header>

  <aside id="side" class="panel">
    <section id="alerts" hidden>
      <h2>Needs attention <span id="alert-count">0</span></h2>
      <ul id="alert-list"></ul>
    </section>
    <section class="feed-wrap">
      <h2>Activity</h2>
      <ul id="feed"></ul>
    </section>
  </aside>

  <section id="detail" class="panel" hidden>
    <button type="button" id="detail-close" aria-label="Close details">×</button>
    <div class="body"></div>
  </section>

  <footer id="legend" class="panel">
    <span><i style="background:#8fa3c7"></i>project</span>
    <span><i style="background:#7fe7ff"></i>session</span>
    <span><i style="background:#5d6f8f"></i>past</span>
    <span><i style="background:#b48cff"></i>subagent</span>
    <span><i style="background:#4ef08a"></i>tool ok</span>
    <span><i style="background:#ff4d6d"></i>failed / over 80%</span>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>

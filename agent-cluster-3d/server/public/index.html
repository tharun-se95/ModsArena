<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Cluster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Layout: words on the left (what is happening, what needs a look, the
     moments so far), the tabletop in the middle, sessions on the right.
     Warm paper and ink, one clay accent; status colors stay separate.
     The office floor's colors are tokens too, with a dark set below.
     The scene reads its colors from these tokens too (table.js). */
  :root {
    --bg: #f4f0e8;
    --paper: #fbf9f4;
    --ink: #1f1d1a;
    --muted: #6d665d;
    --line: #e2dbcf;
    --accent: #b85c3c;
    --ok: #5f8a68;
    --warn: #b9832c;
    --crit: #b4483a;
    /* The scene's own materials */
    --scene: #f1ece3;
    --floor: #e9e2d6;
    --thread: #8a8277;
    --clay: #c46a48;
    /* Critters, beads and books */
    --coral: #ec7a5c; --teal: #2fa59a; --mustard: #e9ad35; --lilac: #9a7ae0;
    --sky: #4b9be0; --leaf: #5fb35a; --pink: #e872a0;
    /* The rooms: wooden floors, a wall color each, warm lamps */
    --wood: #e6cfae; --wood-dark: #8a6446; --trim: #fbf6ec; --glow: #ffcf7a; --window: #bfe3f7; --gem: #f2c14e;
    --room-a: #f6d8c6; --room-b: #cfe9dd; --room-c: #dcdaf5; --room-d: #f5e4b0; --room-e: #f3d0dc; --room-f: #cfe2f3;
    /* The office around the rooms: carpet, outer walls, desks and the coffee corner */
    --night: #23345e; --dawn: #f7c59c; --dusk: #d993a6;
    --carpet: #c9d3cf; --outer-wall: #efe9df; --desk: #f1e6d4; --tile: #f4efe6; --counter: #8fb8b0; --fridge: #f7f5f0;
    --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
    --sans: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b19; --paper: #24221f; --ink: #ece7df; --muted: #a39b90; --line: #3a3631;
      --accent: #d98463; --ok: #8bb592; --warn: #d6a454; --crit: #e07a6a;
      --scene: #1e1d1a; --floor: #26231f; --thread: #8d867b; --clay: #d98463;
      --coral: #f08a6e; --teal: #4cc0b4; --mustard: #f0bb4f; --lilac: #ac90ea; --sky: #66aeea; --leaf: #7cc677; --pink: #ee8ab0;
      --wood: #6b5442; --wood-dark: #3f2f24; --trim: #5e564c; --glow: #ffc266; --window: #3f6f96; --gem: #f5c95a;
      --room-a: #5a443a; --room-b: #36504a; --room-c: #45425e; --room-d: #594f33; --room-e: #573f4b; --room-f: #364b5c;
      --night: #121a33; --dawn: #a8705a; --dusk: #7a4f66;
      --carpet: #343c3a; --outer-wall: #3b3732; --desk: #7a6552; --tile: #4a4540; --counter: #3e5f5a; --fridge: #b9b4ab;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b19; --paper: #24221f; --ink: #ece7df; --muted: #a39b90; --line: #3a3631;
    --accent: #d98463; --ok: #8bb592; --warn: #d6a454; --crit: #e07a6a;
    --scene: #1e1d1a; --floor: #26231f; --thread: #8d867b; --clay: #d98463;
    --coral: #f08a6e; --teal: #4cc0b4; --mustard: #f0bb4f; --lilac: #ac90ea; --sky: #66aeea; --leaf: #7cc677; --pink: #ee8ab0;
    --wood: #6b5442; --wood-dark: #3f2f24; --trim: #5e564c; --glow: #ffc266; --window: #3f6f96; --gem: #f5c95a;
    --room-a: #5a443a; --room-b: #36504a; --room-c: #45425e; --room-d: #594f33; --room-e: #573f4b; --room-f: #364b5c;
    --night: #121a33; --dawn: #a8705a; --dusk: #7a4f66;
    --carpet: #343c3a; --outer-wall: #3b3732; --desk: #7a6552; --tile: #4a4540; --counter: #3e5f5a; --fridge: #b9b4ab;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .app { height: 100%; display: grid; grid-template-columns: 300px minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr); gap: 0 20px; padding-inline: 20px; padding-block: 0 20px; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding-block: 16px; }
  .mark { width: 22px; height: 22px; }
  .word { font: 600 18px var(--serif); letter-spacing: -0.01em; }
  .status { margin-left: 16px; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }

  .words { display: flex; flex-direction: column; gap: 22px; overflow-y: auto; min-height: 0; padding-right: 4px; }
  .eyebrow { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  #now p { margin: 0 0 8px; font: 400 19px/1.45 var(--serif); text-wrap: pretty; }
  #now p + p { font-size: 15.5px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  #look li { margin-bottom: 6px; }
  #look button { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  #look button:hover { color: var(--accent); }
  #moments li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  #moments li time { color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
  #moments li.bad span { color: var(--crit); }
  #moments li.note span { color: var(--accent); }

  .stage-wrap { position: relative; min-width: 0; min-height: 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--scene); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .hint { position: absolute; left: 16px; bottom: 14px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--paper) 80%, transparent); padding: 4px 10px; border-radius: 999px; }
  .tag { pointer-events: auto; cursor: pointer; white-space: nowrap; font-size: 10.5px; }
  .tag.project { display: inline-flex; align-items: baseline; padding: 1px 8px; border-radius: 6px; background: color-mix(in srgb, var(--paper) 72%, transparent); backdrop-filter: blur(3px); }
  .tag .pname { font: 600 11.5px var(--serif); color: color-mix(in srgb, var(--ink) 80%, transparent); letter-spacing: 0.01em; }
  .tag.session { display: inline-flex; gap: 5px; align-items: baseline; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 62%, transparent); backdrop-filter: blur(3px); color: color-mix(in srgb, var(--ink) 78%, transparent); }
  .tag.session.selected { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1.5px var(--accent); }
  .tag .sname { font-weight: 500; max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
  .pct { font: 500 12px var(--mono); }
  .tag .pct { font-size: 9.5px; }
  .pct.ok { color: var(--ok); } .pct.warn { color: var(--warn); } .pct.crit { color: var(--crit); }

  #side { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .sideh { font: 600 15px var(--serif); margin: 2px 0 4px; }
  .scard { display: grid; gap: 6px; padding: 14px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); transition: border-color 0.15s; }
  .scard:hover, .scard.on { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .srow { display: flex; justify-content: space-between; gap: 10px; }
  .stitle { font: 600 15.5px/1.3 var(--serif); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .smeta { font-size: 12px; color: var(--muted); }
  .slast { font-size: 12.5px; color: var(--ink); opacity: 0.8; }
  .meter { display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .meter span { display: block; height: 100%; border-radius: inherit; }
  .meter .ok { background: var(--ok); } .meter .warn { background: var(--warn); } .meter .crit { background: var(--crit); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex: none; }
  .dot.crit { background: var(--crit); }
  .dot.coral { background: var(--coral); } .dot.teal { background: var(--teal); } .dot.mustard { background: var(--mustard); } .dot.lilac { background: var(--lilac); }
  .dot.sky { background: var(--sky); } .dot.leaf { background: var(--leaf); } .dot.pink { background: var(--pink); }
  .back { color: var(--muted); font-size: 13px; }
  .back:hover { color: var(--accent); }
  .dtitle { font: 600 22px/1.25 var(--serif); margin: 4px 0 0; text-wrap: balance; }
  .dmeta { margin: 0; color: var(--muted); font-size: 13px; }
  .dgauge { display: flex; gap: 10px; align-items: baseline; margin-top: 6px; }
  .dgauge .big { font: 500 28px var(--mono); }
  .dgauge .big.ok { color: var(--ok); } .dgauge .big.warn { color: var(--warn); } .dgauge .big.crit { color: var(--crit); }
  .dgauge span:last-child { color: var(--muted); font-size: 13px; }
  #side h3 { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
  .line { margin: 0; font-size: 13px; display: flex; align-items: center; flex-wrap: wrap; }
  .line.mono { font: 12.5px var(--mono); }
  .line.bad { color: var(--crit); }
  .muted { color: var(--muted); }
  .line .muted { margin-left: 6px; }

  [hidden] { display: none !important; }
  .status.down i { background: var(--crit); box-shadow: 0 0 0 4px color-mix(in srgb, var(--crit) 20%, transparent); }
  .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .toggle input { accent-color: var(--accent); margin: 0; }
  .tag.project { pointer-events: auto; cursor: pointer; }
  .tag.project.focused { box-shadow: 0 0 0 1.5px var(--accent); }
  .tag.project.coffee { pointer-events: none; }
  .tag.project.focused .pname { color: var(--accent); }
  .tag .pmore { margin-left: 6px; font-size: 10px; color: var(--muted); }
  .tag.session.past { opacity: 0.6; }
  .tag.session.crowded .sname { display: none; }
  .tag.session.covered { visibility: hidden; }
  .tag.session.past .sname { font-weight: 400; }
  .scard.past { background: transparent; }
  .scard.past .stitle { font-weight: 400; }
  .dtitle .dot { width: 10px; height: 10px; vertical-align: middle; }
  #look button, #moments span { text-align: left; }
  #look li.muted button { font-weight: 400; color: var(--muted); }

  /* The hover bubble over a critter, and the marks that float over one. */
  .bubble { position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, calc(-100% - 10px)); max-width: 260px; padding: 9px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14); font-size: 12px; line-height: 1.4; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: var(--paper); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
  .bubble b { display: block; font: 600 13px/1.3 var(--serif); }
  .bubble b .dot { width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }
  .bubble p { margin: 2px 0 0; color: var(--muted); }
  .bubble dl { margin: 6px 0 0; display: grid; gap: 2px; }
  .bubble dl div { display: flex; gap: 8px; }
  .bubble dt { color: var(--muted); min-width: 62px; }
  .bubble dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; font-family: var(--mono); font-size: 11px; }
  .flag { pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  .flag.on { opacity: 1; }
  .flag.zzz { font: 600 12px var(--serif); color: var(--muted); }
  .flag.zzz i { display: inline-block; font-style: normal; animation: zzz 2.4s ease-in-out infinite; }
  .flag.zzz i:nth-child(2) { font-size: 10px; animation-delay: 0.4s; }
  .flag.zzz i:nth-child(3) { font-size: 8px; animation-delay: 0.8s; }
  @keyframes zzz { 0% { transform: translate(0, 4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(6px, -14px); opacity: 0; } }
  .flag.oops { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--crit); color: #fff; font: 700 11px var(--sans); transform: scale(0.6); transition: opacity 0.2s, transform 0.2s; }
  .flag.oops.on { transform: scale(1); }
  .flag.oops.small { width: 13px; height: 13px; font-size: 9px; }
  @media (prefers-reduced-motion: reduce) { .flag.zzz i { animation: none; } }
  @media (max-width: 1080px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 52vh auto auto; height: auto; padding-inline: 16px; gap: 20px; }
    html, body { height: auto; }
    .stage-wrap { grid-row: 2; height: 52vh; }
    .words { grid-row: 3; overflow: visible; }
    #side { grid-row: 4; overflow: visible; }
  }
  @media (max-width: 600px) {
    .hint .more { display: none; }
    .tag .sname { max-width: 72px; }
  }
  @media (prefers-reduced-motion: reduce) { .scard { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="4.2" fill="var(--accent)"/><circle cx="11" cy="11" r="8.6" fill="none" stroke="var(--line)" stroke-width="1.6"/><circle cx="18.2" cy="6.4" r="2" fill="var(--ink)"/></svg>
    <span class="word">Agent Cluster</span>
    <label class="toggle"><input type="checkbox" id="show-past" checked> Past sessions</label>
    <span class="status" id="conn"><i></i><span>Connecting…</span></span>
  </header>

  <section class="words" aria-label="Summary">
    <div><p class="eyebrow">Right now</p><div id="now"></div></div>
    <div><p class="eyebrow">Needs a look</p><ul id="look"></ul></div>
    <div><p class="eyebrow">Moments</p><ul id="moments"></ul></div>
  </section>

  <main class="stage-wrap">
    <div id="stage" aria-label="Your sessions in an office: each project is a room, each session a colorful critter at its own desk, its subagents stand behind it, and small beads rise with each tool call"></div>
    <span class="hint">Drag to look around<span class="more"> &middot; click a critter to see what it&rsquo;s doing &middot; click a project to zoom in</span></span>
  </main>

  <aside id="side" aria-live="polite"></aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>

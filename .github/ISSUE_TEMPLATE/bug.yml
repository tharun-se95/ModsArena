name: Something isn't working
description: Agent Office (or another ModsArena mod) does something it shouldn't, or doesn't do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. A vulnerability? Please don't file it here: see [SECURITY.md](https://github.com/tharun-se95/ModsArena/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Run /office
        2. Click …
  - type: textarea
    id: doctor
    attributes:
      label: Doctor's report
      description: Run `npx github:tharun-se95/ModsArena doctor` in a terminal and paste what it prints. It lists versions and checks, nothing private.
      render: text
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 141, Safari 26, …
  - type: textarea
    id: log
    attributes:
      label: Bridge log (optional)
      description: The last lines of `~/.claude/agent-office/bridge.log`, if the bridge misbehaved. Check them for anything private first.
      render: text

name: Release

# Publishes a GitHub Release for the version in the manifests, two ways:
#
#   - push a tag like v0.2.1 on main, or
#   - Actions → Release → Run workflow on main: the workflow creates the
#     v<version> tag on that commit itself.
#
# Either way the tag must match the version in every manifest
# (scripts/version.mjs), the notes are that version's CHANGELOG.md section,
# and the release carries the hosted demo as one HTML file you can open
# offline.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Which tag, and does it match every manifest and have notes
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag="$GITHUB_REF_NAME"
          else tag="v$(node scripts/version.mjs check)"; fi
          node scripts/version.mjs check "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: node --test agent-office/server/*.test.mjs scripts/*.test.mjs
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict agent-office
      - name: Build the offline demo
        run: |
          node scripts/build-demo-site.mjs site
          cp site/index.html "agent-office-demo-$TAG.html"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/version.mjs notes "$TAG" > notes.md
          printf '\n\n**Install:** `/plugin marketplace add tharun-se95/ModsArena`, then `/plugin install agent-office@modsarena`. **Update:** run `/office auto-update` once and new versions arrive on their own (or turn it on under `/plugin` → Marketplaces → modsarena); to update by hand, `claude plugin update agent-office@modsarena`. **Try it:** https://tharun-se95.github.io/ModsArena/\n' >> notes.md
          # A pushed tag must already exist; a manual run creates it on this commit.
          if [ "$GITHUB_EVENT_NAME" = push ]; then where=--verify-tag
          else where="--target=$GITHUB_SHA"; fi
          gh release create "$TAG" "$where" \
            --title "Agent Office ${TAG#v}" \
            --notes-file notes.md \
            "agent-office-demo-$TAG.html"
